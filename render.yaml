databases:
  - name: internship-tracker-db
    databaseName: internship_tracker
    user: internship_tracker
    plan: free

services:
  - type: web
    name: internship-tracker-api
    runtime: docker
    plan: free
    healthCheckPath: /companies
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: internship-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: internship-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: internship-tracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: internship-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: internship-tracker-db
          property: password
      - key: FRONTEND_ORIGIN
        value: https://internship-tracker-frontend.onrender.com

  - type: web
    name: internship-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://internship-tracker-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
